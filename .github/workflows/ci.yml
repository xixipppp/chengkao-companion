name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # v3.4.1：静态门禁扩到四件套——新增版本号一致性（ver_check）与题库数据契约（data_check）
      - name: Static checks (内联脚本语法 + 重名/悬空自检 + 版本一致性 + 题库数据契约 + 2D讲解时长预算)
        run: |
          node tools/syntax_check.js
          node tools/dup_check.js
          node tools/ver_check.js
          node tools/data_check.js
          # v3.5.0：2D 讲解引擎时长预算跑批（全库 2265 题必须落在 30~60 秒，越界则 exit 1）
          node tools/anim2d_dur_check.js

      # v3.4.1：playwright 版本锁定（package.json）+ 浏览器缓存，告别每次全量下载 170MB
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Playwright (chromium)
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start static servers + run regression tests
        run: |
          python3 -m http.server 8900 >/dev/null 2>&1 &
          python3 -m http.server 8899 >/dev/null 2>&1 &
          # 服务就绪轮询（替代裸 sleep，慢 runner 防 race）
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8900/index.html && curl -sf -o /dev/null http://127.0.0.1:8899/index.html && break
            sleep 1
          done
          # 校验返回体确为本应用（防端口被占误连他人服务）
          curl -s http://127.0.0.1:8900/index.html | grep -q "心动成考" || { echo "8900 端口内容不符"; exit 1; }

          fail=0
          # v3.5.0：anim2d_test 是纯 node 单测（不依赖浏览器），校验 2D 讲解引擎的时长/结构/不编造
          # v3.5.2：passage_smoke 纯 node 单测，校验各卷英文原文解析率（防真题原文数据回归）
          for t in offline_test audit_fix_test conv_test games_test gap2_test legacy_fix_test perf_test phase1_visual_test tree_test notes_test anim2d_test passage_smoke; do
            echo "=== $t ==="
            timeout 300 node "tests/$t.js" && echo "$t PASS ✅" || { echo "$t FAIL ❌"; fail=1; }
          done

          # v3.4.1：online_regression（207 条断言，约占全库九成）纳入流水线
          # CI 环境下 TEST_CHANNEL 为空 → 使用已安装的 chromium；TEST_URL 指向本地服务
          echo "=== online_regression（本地服务版） ==="
          TEST_URL=http://127.0.0.1:8900/index.html timeout 600 node tests/online_regression.js \
            && echo "online_regression PASS ✅" || { echo "online_regression FAIL ❌"; fail=1; }

          # v3.6.0：audio_smoke 校验音效引擎 + 全科目朗读 + 移动端 TTS 加固 + 云端兜底
          echo "=== audio_smoke（本地服务版） ==="
          TEST_URL=http://127.0.0.1:8900/index.html timeout 300 node tests/audio_smoke.js \
            && echo "audio_smoke PASS ✅" || { echo "audio_smoke FAIL ❌"; fail=1; }

          # v3.7.0：p0_smoke 校验 AI 连通测试 / 填空归一化+符号键盘 / 复仇战分界 / 战报卡+口诀
          echo "=== p0_smoke（本地服务版） ==="
          TEST_URL=http://127.0.0.1:8900/index.html timeout 300 node tests/p0_smoke.js \
            && echo "p0_smoke PASS ✅" || { echo "p0_smoke FAIL ❌"; fail=1; }

          # v3.8.0：p1_smoke 校验全站按钮层级/触控/输入防缩放 + 笔记收藏 + 雷达行动卡 + AI 内置 Key/模型可配
          echo "=== p1_smoke（本地服务版） ==="
          TEST_URL=http://127.0.0.1:8900/index.html timeout 300 node tests/p1_smoke.js \
            && echo "p1_smoke PASS ✅" || { echo "p1_smoke FAIL ❌"; fail=1; }

          # v3.9.0：p2_smoke 校验考点级口诀库（全库覆盖/命中率）+ 2D 动画真演算重制（新分镜/真曲线/口诀收尾）
          echo "=== p2_smoke（本地服务版） ==="
          TEST_URL=http://127.0.0.1:8900/index.html timeout 300 node tests/p2_smoke.js \
            && echo "p2_smoke PASS ✅" || { echo "p2_smoke FAIL ❌"; fail=1; }

          exit $fail

      # v3.4.1：失败留证——上传测试截图/产物
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            tests/_*.png
            tests/_*.html
          if-no-files-found: ignore
